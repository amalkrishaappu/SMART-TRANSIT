{% extends 'base.html' %}

{% block title %}Login - Smart College Transportation Management System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 shadow-sm">
                <div class="text-center mb-4">
                    <div class="display-6 text-primary mb-2"><i class="fas fa-bus-alt"></i></div>
                    <h3 class="fw-bold">SmartTransit Portal</h3>
                    <p class="text-muted">Sign in with your college credentials</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger py-2" role="alert">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'login-view' %}" id="loginForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username or ID</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        <i class="fas fa-sign-in-alt me-1"></i> Sign In
                    </button>
                </form>

                <hr class="my-4">

                <div>
                    <h6 class="text-muted small text-center mb-3">QUICK DEMO LOGIN SELECTOR</h6>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('admin', 'admin123')">
                            <i class="fas fa-user-shield text-danger me-2"></i> <strong>Administrator</strong> (admin / admin123)
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('student1', 'student123')">
                            <i class="fas fa-user-graduate text-primary me-2"></i> <strong>Student: Amal</strong> (student1 / student123)
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('driver1', 'driver123')">
                            <i class="fas fa-id-card text-success me-2"></i> <strong>Driver: Suresh</strong> (driver1 / driver123)
                        </button>
                        <button type="button" class="btn btn-outline-dark btn-sm text-start" onclick="fillCreds('parent1', 'parent123')">
                            <i class="fas fa-user-friends text-info me-2"></i> <strong>Parent: Joseph</strong> (parent1 / parent123)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
    document.getElementById('loginForm').submit();
}
</script>
{% endblock %}
